spec:
  name: pixelfed
  services:
  - name: web
    git:
      branch: dev
      repo_clone_url: https://github.com/OliverMensahDev/pixelfed.git
    envs:
    - key: DB_FOO_1
      value: "DB-password-testvalue"
      type: SECRET
    - key: EMAIL
      scope: RUN_TIME
    - key: MESSAGE
      value: "This is a greeting message"
    - key: DATABASE_URL
      scope: RUN_TIME
      value: ${example-db.DATABASE_URL}
  databases:
  - name: example-db